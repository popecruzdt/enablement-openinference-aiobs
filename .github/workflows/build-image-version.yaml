name: Build AI Travel Advisor image (manual version)

# Builds the app image from a commit you choose and publishes it under a version tag you choose,
# for example version 2.0.0 from commit 4bf387cacfb7f613c238c3b181c9dc134cb2d33e.
# Run it from the Actions tab ("Run workflow"). It never touches :latest, which build-image.yaml owns.
# Published tags: :<version> and :<full commit sha>.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish, for example 2.0.0"
        required: true
        type: string
      commit:
        description: "Commit to build: full or short SHA, branch or tag"
        required: true
        type: string
      overwrite:
        description: "Replace the tag if it already exists"
        required: false
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/ai-travel-advisor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the inputs
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::version must look like 2.0.0 (optionally 2.0.0-rc1), got '$VERSION'"; exit 1
          fi
          if [ -z "$COMMIT" ]; then echo "::error::commit is required"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version
        if: ${{ !inputs.overwrite }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists. Pick another version, or run again with overwrite enabled."; exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Containerfile
          # amd64 only: arm64 under QEMU took ~40 min in pip; all target environments are x86.
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:${{ steps.commit.outputs.sha }}

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "Published \`$IMAGE:$VERSION\` from commit \`$SHA\`."
            echo
            echo "To use it, set the tag in app/k8s/40-travel-advisor.yaml to \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
