name: Build AI Travel Advisor image

# Publishes the app image that app/k8s/40-travel-advisor.yaml pulls.
# After the first push, set the GHCR package to public so learner environments can pull it anonymously.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/ai-travel-advisor
  # Keep in sync with the image tag in app/k8s/40-travel-advisor.yaml
  VERSION: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ github.sha }}
