name: Build AI Travel Advisor image

# Publishes the app image that app/k8s/40-travel-advisor.yaml pulls, on every push to main:
#   :latest        the current state of main (what the manifest pulls)
#   :<commit sha>  the same image, for traceability
# For a fixed version (for example 2.0.0) built from a commit you choose, run the
# "Build AI Travel Advisor image (manual version)" workflow (build-image-version.yaml).
# After the first push, set the GHCR package to public so learner environments can pull it anonymously.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/ai-travel-advisor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Containerfile
          # amd64 only: arm64 under QEMU took ~40 min in pip; all target environments are x86.
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
