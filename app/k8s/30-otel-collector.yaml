# OTLP-only mode: the collector exports app telemetry to Dynatrace (no OneAgent).
# DT_OTLP_ENDPOINT / DT_OTLP_TOKEN come from the `dynatrace` Secret created by deployTravelAdvisor.
# Traces go to Dynatrace (traces/dynatrace, with gen_ai_normalizer) and to Arize AX (traces/arize, otlp_grpc/arize, gRPC). ARIZE_OTLP_ENDPOINT / ARIZE_SPACE_ID / ARIZE_API_KEY
# come from the `arize` Secret created by deployTravelAdvisor; without credentials it holds placeholders and
# the Arize export does not work. The app sets openinference.project.name, which names the Arize AX project.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: ai-travel-advisor
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: weaviate
              scrape_interval: 15s
              static_configs:
                - targets: ["weaviate:2112"]
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      cumulative_to_delta: {}
      # Maps OpenInference attributes to the OpenTelemetry gen_ai.* conventions so Dynatrace AI Observability
      # understands the LLM, agent and tool spans. Applied only on the Dynatrace pipeline: the original
      # OpenInference attributes are kept (no remove_originals) but Arize does not need the extra ones.
      gen_ai_normalizer:
        sources:
          - name: openinference
      resource/training:
        attributes:
          - key: service.namespace
            value: openinference-aiobs
            action: upsert
    exporters:
      otlp_http/dynatrace:
        endpoint: ${env:DT_OTLP_ENDPOINT}
        headers:
          Authorization: "Api-Token ${env:DT_OTLP_TOKEN}"
      otlp_grpc/arize:
        endpoint: ${env:ARIZE_OTLP_ENDPOINT}
        headers:
          arize-space-id: ${env:ARIZE_SPACE_ID}
          arize-api-key: ${env:ARIZE_API_KEY}
        timeout: 20s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 10s
    service:
      pipelines:
        traces/dynatrace:
          receivers: [otlp]
          processors: [resource/training, gen_ai_normalizer, batch]
          exporters: [otlp_http/dynatrace]
        traces/arize:
          receivers: [otlp]
          processors: [resource/training, batch]
          exporters: [otlp_grpc/arize]
        metrics:
          receivers: [otlp, prometheus]
          processors: [resource/training, cumulative_to_delta, batch]
          exporters: [otlp_http/dynatrace]
        logs:
          receivers: [otlp]
          processors: [resource/training, batch]
          exporters: [otlp_http/dynatrace]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ai-travel-advisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: ghcr.io/dynatrace/dynatrace-otel-collector/dynatrace-otel-collector:0.58.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          env:
            - name: DT_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef: { name: dynatrace, key: endpoint }
            - name: DT_OTLP_TOKEN
              valueFrom:
                secretKeyRef: { name: dynatrace, key: token }
            - name: ARIZE_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef: { name: arize, key: endpoint }
            - name: ARIZE_SPACE_ID
              valueFrom:
                secretKeyRef: { name: arize, key: space-id }
            - name: ARIZE_API_KEY
              valueFrom:
                secretKeyRef: { name: arize, key: api-key }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ai-travel-advisor
spec:
  selector:
    app: otel-collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
