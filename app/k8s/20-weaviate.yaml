apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weaviate-pvc
  namespace: ai-travel-advisor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate
  namespace: ai-travel-advisor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
        - name: weaviate
          image: cr.weaviate.io/semitechnologies/weaviate:1.30.1
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 2112
          env:
            - { name: PROMETHEUS_MONITORING_ENABLED, value: "true" }
            - { name: QUERY_DEFAULTS_LIMIT, value: "25" }
            - { name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED, value: "true" }
            - { name: PERSISTENCE_DATA_PATH, value: /var/lib/weaviate }
            - { name: DEFAULT_VECTORIZER_MODULE, value: none }
            - { name: ENABLE_API_BASED_MODULES, value: "true" }
            - { name: ENABLE_MODULES, value: "text2vec-ollama,generative-ollama" }
            - { name: AUTOSCHEMA_ENABLED, value: "false" }
            - { name: CLUSTER_HOSTNAME, value: node1 }
            - { name: RAFT_BOOTSTRAP_EXPECT, value: "1" }
            - { name: RAFT_JOIN, value: "node1:8300" }
            - { name: CLUSTER_GOSSIP_BIND_PORT, value: "7000" }
          readinessProbe:
            httpGet:
              path: /v1/.well-known/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: weaviate-data
              mountPath: /var/lib/weaviate
      volumes:
        - name: weaviate-data
          persistentVolumeClaim:
            claimName: weaviate-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: ai-travel-advisor
spec:
  selector:
    app: weaviate
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 50051, targetPort: 50051 }
    - { name: metrics, port: 2112, targetPort: 2112 }
